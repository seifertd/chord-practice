<!doctype html>

<html lang="en">

  <head>

    <title>Chord Practice - Down for maintenance</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <!-- Self-contained on purpose: while shared/maintenance.html exists, nginx
         answers EVERY request with this file, so it can't load assets or
         favicons from the app. The logo is app/assets/images/guitar.png inlined. -->
    <style>

      :root {
        --bg: #fff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --ink: #374151;
        --button: #1d4ed8;
        --button-hover: #1e40af;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f2937;
          --text: #fff;
          --muted: #9ca3af;
          --border: #374151;
          --ink: #d1d5db;
          --button: #2563eb;
          --button-hover: #1d4ed8;
        }
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      nav {
        border-bottom: 1px solid var(--border);
        padding: 0.625rem 1rem;
      }

      nav a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: inherit;
        text-decoration: none;
        font-size: 1.25rem;
        font-weight: 600;
        white-space: nowrap;
      }

      nav img {
        height: 2rem;
      }

      main {
        flex: 1;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.25rem;
        padding: 2rem 1rem;
        text-align: center;
      }

      main svg {
        width: 9rem;
        height: auto;
        color: var(--ink);
      }

      h1 {
        font-size: 1.875rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      p {
        color: var(--muted);
        max-width: 28rem;
      }

      .button {
        color: #fff;
        background: var(--button);
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.5rem 1rem;
        text-decoration: none;
      }

      .button:hover {
        background: var(--button-hover);
      }

    </style>

  </head>

# Version-controlled copy of /etc/nginx/conf.d/chord-practice.conf on capo.
# Not deployed automatically: after editing, copy it into place with sudo, then
# `sudo nginx -t && sudo systemctl reload nginx`. The "managed by Certbot"
# lines are rewritten by certbot on the server, so diff before installing.

upstream chordpractice {
  server 127.0.0.1:4000 max_fails=1 fail_timeout=30s;
}

server {
  server_name www.chord-practice.com;
  return  301 https://chord-practice.com$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chord-practice.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chord-practice.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
  client_max_body_size 10M;
  server_name chord-practice.com;
  root /home/doug/webapps/chord-practice/production/current/public;

  access_log  /var/log/nginx/chord_practice_access.log  apps;

  # remove trailing slash from all requests to app
  if ($request_method = GET) {
    rewrite ^/(.*)/$ $scheme://$host/$1 permanent;
  }

  location ~ ^/assets/ {
    expires 1y;
    add_header Cache-Control public;
    add_header Access-Control-Allow-Origin *;
    add_header ETag "";
    break;
  }

  set $maint "";

  if (-f /home/doug/webapps/chord-practice/production/shared/maintenance.html) {
    set $maint M;
  }

  if ($maint = M) {
    return 503;
  }

  error_page 503 @503;
  # public/503.html is self-contained (inline CSS, no assets), so every
  # request maps to it.
  location @503 {
    root /home/doug/webapps/chord-practice/production/current/public;
    rewrite ^ /503.html break;
  }

  location / { 
    proxy_pass http://chordpractice/;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header Host $http_host;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chord-practice.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chord-practice.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = chord-practice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  server_name chord-practice.com;
    return 404; # managed by Certbot


}

server {
    if ($host = www.chord-practice.com) {
        return 301 https://chord-practice.com$request_uri;
    } # managed by Certbot


  listen 80;
  server_name www.chord-practice.com;
    return 404; # managed by Certbot


}
